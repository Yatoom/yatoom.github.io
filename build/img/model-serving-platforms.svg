<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise Model-Serving Platforms</title>
  <desc id="desc">Architecture showing an MLflow platform built on isolated Azure Machine Learning workspaces handing registered models to separate batch and real-time model-serving platforms.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071426"/>
      <stop offset=".55" stop-color="#0f1f3d"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="mlflow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#075985"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="batch" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="realtime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4338ca"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="165%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <g stroke="#60a5fa" stroke-opacity=".055">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>

  <text x="70" y="70" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700">Enterprise Model-Serving Platforms</text>
  <text x="70" y="103" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">One governed model lifecycle · Two production serving paths</text>
  <g fill="#22d3ee"><circle cx="1064" cy="72" r="5"/><circle cx="1084" cy="72" r="5"/><circle cx="1104" cy="72" r="5"/></g>

  <g filter="url(#shadow)">
    <rect x="334" y="137" width="532" height="166" rx="20" fill="url(#mlflow)" stroke="#67e8f9" stroke-opacity=".75"/>
    <rect x="358" y="159" width="86" height="27" rx="13.5" fill="#083344" stroke="#67e8f9" stroke-opacity=".65"/>
    <text x="401" y="178" fill="#cffafe" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">MODEL HUB</text>
    <text x="358" y="220" fill="#fff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">MLflow Platform</text>
    <text x="358" y="247" fill="#cffafe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Experiment tracking · Registry · Isolated workspaces</text>
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">
      <rect x="358" y="260" width="140" height="28" rx="8" fill="#083344" fill-opacity=".82"/><text x="428" y="279" fill="#cffafe">MLflow API</text>
      <rect x="508" y="260" width="184" height="28" rx="8" fill="#083344" fill-opacity=".82"/><text x="600" y="279" fill="#cffafe">AzureML Workspaces</text>
      <rect x="702" y="260" width="134" height="28" rx="8" fill="#083344" fill-opacity=".82"/><text x="769" y="279" fill="#cffafe">Terraform</text>
    </g>
  </g>

  <path d="M500 303V336H306V374" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M700 303V336H894V374" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  

  <g filter="url(#shadow)">
    <rect x="70" y="374" width="472" height="188" rx="20" fill="url(#batch)" stroke="#93c5fd" stroke-opacity=".65"/>
    <rect x="94" y="396" width="114" height="27" rx="13.5" fill="#172554" stroke="#93c5fd" stroke-opacity=".65"/>
    <text x="151" y="415" fill="#dbeafe" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">BATCH SERVING</text>
    <text x="94" y="459" fill="#fff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="700">Batch Model-Serving Platform</text>
    <text x="94" y="489" fill="#dbeafe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Scheduled · Ad hoc · Data-aware orchestration</text>
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">
      <rect x="94" y="514" width="100" height="30" rx="8" fill="#172554" fill-opacity=".75"/><text x="144" y="534" fill="#bfdbfe">Airflow</text>
      <rect x="202" y="514" width="100" height="30" rx="8" fill="#172554" fill-opacity=".75"/><text x="252" y="534" fill="#bfdbfe">Databricks</text>
      <rect x="310" y="514" width="100" height="30" rx="8" fill="#172554" fill-opacity=".75"/><text x="360" y="534" fill="#bfdbfe">Bundles</text>
      <rect x="418" y="514" width="100" height="30" rx="8" fill="#172554" fill-opacity=".75"/><text x="468" y="534" fill="#bfdbfe">Terraform</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="658" y="374" width="472" height="188" rx="20" fill="url(#realtime)" stroke="#c7d2fe" stroke-opacity=".65"/>
    <rect x="682" y="396" width="136" height="27" rx="13.5" fill="#312e81" stroke="#c7d2fe" stroke-opacity=".65"/>
    <text x="750" y="415" fill="#e0e7ff" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">REAL-TIME SERVING</text>
    <text x="682" y="459" fill="#fff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="700">Real-Time Model-Serving Platform</text>
    <text x="682" y="489" fill="#e0e7ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Low latency · Progressive delivery · Traffic control</text>
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">
      <rect x="682" y="514" width="100" height="30" rx="8" fill="#312e81" fill-opacity=".82"/><text x="732" y="534" fill="#e0e7ff">AzureML</text>
      <rect x="790" y="514" width="100" height="30" rx="8" fill="#312e81" fill-opacity=".82"/><text x="840" y="534" fill="#e0e7ff">Postgres</text>
      <rect x="898" y="514" width="100" height="30" rx="8" fill="#312e81" fill-opacity=".82"/><text x="948" y="534" fill="#e0e7ff">Kong</text>
      <rect x="1006" y="514" width="100" height="30" rx="8" fill="#312e81" fill-opacity=".82"/><text x="1056" y="534" fill="#e0e7ff">Bicep</text>
    </g>
  </g>

  <text x="306" y="597" fill="#93c5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">High-throughput predictions over datasets</text>
  <text x="894" y="597" fill="#a5b4fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">Governed predictions over APIs</text>
</svg>
